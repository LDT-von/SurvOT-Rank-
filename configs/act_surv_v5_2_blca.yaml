name: act_surv_v5_2_blca
description: >
  v5.2 ACT-Surv — Path 1 + 隐藏点 1-4 全调。
  在 v5.1 基础上叠加 4 个隐藏调优点：
    (1) max_pairs: 4096 → 16384（用更多 ranking pair，即使 λ_rank=0 也保留代码路径）
    (2) margin: 0.02 → 0.0（去掉硬 margin，平滑梯度，DeepHit 风格）
    (3) temperature: 0.5 → 1.0（更平滑的 sigmoid）
    (4) lambda_balance: 0.05 → 0.10（KL 平衡进一步增强）
  注意：核心改动仍是去 ranking（v5.1 的改动），4 个隐藏点是边际改善。

data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: survot_rank/research/legacy/slotspe_runtime/dataset_csv
  wsi_encoder: uni
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1024

split:
  k_start: 0
  k_end: 5

train:
  survot_method: archetypal_transport_composition_v5
  specific_simple: act_surv_v5_2_blca
  results_dir: results/act_surv_v5_2/blca
  max_epochs: 50
  batch_size: 8
  grad_clip_norm: 1.0
  early_stop_patience: 0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_stratified_batches: true
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  eta_min: 0.000001
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  min_free_space_gb: 2.0

model:
  wsi_projection_dim: 256

  # ── ACT-Surv v5 core（与 v5 一致）────────────────────────────────
  act5_num_archetypes: 6
  act5_epsilon: 0.10
  act5_hazard_scale: 1.0
  act5_warmup_epochs: 5

  # ── v5.2 = v5.1（去 ranking）+ 4 个隐藏点全调 ────────────────────
  act5_lambda_balance: 0.10   # 隐藏点 4: 0.05 → 0.10（KL 平衡再增强 2×）
  act5_lambda_rank: 0.00      # 与 v5.1 一致（去掉 IPCW ranking）
  act5_rank_margin: 0.00      # 隐藏点 2: 0.02 → 0.0（去掉硬 margin）
  act5_rank_temperature: 1.00 # 隐藏点 3: 0.5 → 1.0（更平滑的 sigmoid）
  act5_rank_max_pairs: 16384  # 隐藏点 1: 4096 → 16384（更多 pair，代码路径保留）