name: catet_v2_blca
description: CATET v2 — catet_old mechanism + cohort-anchored pre-routing (CA-PSA) + lazy archetype prior on BLCA DSS.

data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: survot_rank/research/legacy/slotspe_runtime/dataset_csv
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1024

split:
  k_start: 0
  k_end: 5

train:
  survot_method: censoring_aware_temporal_evidence_transport
  specific_simple: catet_v2_blca
  results_dir: results/catet_v2
  max_epochs: 50
  # Larger batch to give IPCW rank enough comparable pairs (was 4 in
  # catet_old, 16 in catet_final).  We keep the original 16 since the
  # OT eps scheduler is robust to that batch.
  batch_size: 16
  grad_accum_steps: 1
  warmup_epochs: 5
  grad_clip_norm: 1.0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_stratified_batches: true
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  eta_min: 0.000001
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  min_free_space_gb: 2.0

slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st

model:
  otehv2_eps: 0.05
  otehv2_iter: 50
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.1
  # catet_old original weights (no lambda_stage from final).
  catet_num_stages: 4
  catet_prog_cost: 0.20
  catet_lambda_ot: 0.04
  catet_lambda_rank: 0.08
  catet_lambda_intervention: 0.05
  catet_keep_ratio: 0.25
  catet_intervention_margin: 0.05
  catet_rank_margin: 0.0
  catet_rank_max_pairs: 4096
  # Monotonic OT-eps anneal (15aa637 fix).
  rg_eps_start: 0.10
  rg_eps_anneal: 12
  # v2: cohort-anchored pre-routing + lazy archetype prior.
  catet_cohort_routes: 4
  catet_cohort_topk: 2
  catet_lambda_route: 0.02
  catet_use_archetype_prior: 1
