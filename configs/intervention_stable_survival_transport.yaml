name: intervention_stable_survival_transport_cross_cancer
description: Frozen v4.0 staged stability-cost transport for cross-cancer DSS evaluation.

# The launcher overrides `study` for each queued cancer. Keeping the complete
# recipe here makes a single generated command independently reproducible.
data:
  study: blca
  data_root_dir: /data1/TCGA-UNI2-h-features
  data_path: survot_rank/research/legacy/slotspe_runtime/dataset_csv
  wsi_encoder: uni2-h
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536

split:
  k_start: 0
  k_end: 5

train:
  survot_method: intervention_stable_survival_transport
  specific_simple: ist_v40_staged_cost_only
  results_dir: results/ist_surv_v4.0_staged_50ep/clean/abl_b_cost_only/blca
  max_epochs: 50
  batch_size: 8
  grad_accum_steps: 1
  warmup_epochs: 5
  grad_clip_norm: 1.0
  early_stop_patience: 0
  fit_bins_on_train: true
  binning_mode: global_qcut
  event_sampling_fraction: 0.0
  event_stratified_batches: false
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  eta_min: 0.000001
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  min_free_space_gb: 2.0

model:
  wsi_projection_dim: 256
  ist_eps: 0.05
  ist_sinkhorn_iters: 30
  ist_num_interventions: 2
  ist_keep_ratio: 0.75
  ist_stability_beta: 1.0
  ist_stability_strength: 0.10
  # BLCA A/B/C ablation found no benefit from the auxiliary losses. The one
  # retained IST mechanism is intervention stability fed back into OT cost.
  ist_lambda_plan: 0.0
  ist_lambda_attribution: 0.0
  ist_lambda_risk: 0.0
  ist_edge_value_scale: 4.0
  ist_eval_seed: 20260725
  ist_deletion_penalty: 8.0
  ist_warmup_epochs: 5
  ist_ramp_epochs: 10
