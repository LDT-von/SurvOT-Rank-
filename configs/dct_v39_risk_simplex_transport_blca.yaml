name: dct_v39_risk_simplex_transport_blca
description: >
  DCT v3.9 Risk-Simplex Transport on BLCA DSS. 预测被定义为患者跨模态耦合在
  低危/高危队列锚定几何之间的坐标 lambda，而不是一个自由回归的风险分数。
  相对 v3.3 删除了塌缩的 shared prototype 池化、ETAR、geometry reliability
  与 evidence cost 分支。

data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: survot_rank/research/legacy/slotspe_runtime/dataset_csv
  wsi_encoder: uni2-h
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536

split:
  k_start: 0
  k_end: 1

train:
  survot_method: dct_v39_risk_simplex_transport
  specific_simple: dct_v3.9_risk_simplex_transport_blca
  results_dir: results/dct_v3.9_risk_simplex_transport/blca
  max_epochs: 50
  batch_size: 8
  grad_accum_steps: 1
  warmup_epochs: 5
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  # 严格协议：分箱只在训练折上拟合，删失患者保留在似然中。
  fit_bins_on_train: true
  event_stratified_batches: true
  min_free_space_gb: 2.0

slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st

model:
  otehv2_eps: 0.05
  otehv2_iter: 50
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.15
  dct_num_stages: 4
  # 目标只有两项：trainer 提供的 NLL + IPCW 排序。
  dct_lambda_ipcw_rank: 0.10
  dct_ipcw_rank_margin: 0.02
  dct_ipcw_rank_temperature: 0.50
  dct_ipcw_max_weight: 10.0
  dct_anchor_momentum: 0.90
  dct_evidence_mass_floor: 0.05
  dct_evidence_marginal_strength: 1.0
  dct_coupling_projection_tol: 0.0001
  dct_mix_ratio: 0.50
  fet_lambda_sparse: 0.0
  fet_lambda_faith: 0.0
  spt_prog_cost: 0.20
  rg_eps_start: 0.10
  rg_eps_anneal: 12
  # v3.9 专属项
  dct_v39_center_slots: true
  dct_v39_residual_scale: 0.0
  # 温度需匹配锚点代价差的尺度（实测约 0.01）；autoscale 会用首个 batch 标定。
  dct_v39_tau_init: 0.02
  dct_v39_tau_autoscale: true
  dct_v39_anchor_freeze_epoch: 0
  dct_v39_lambda_spread_target: 0.0
  dct_v39_projection_iters: 3
