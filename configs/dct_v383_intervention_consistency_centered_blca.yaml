name: dct_v383_intervention_consistency_centered_blca
description: >
  DCT v3.8.3 = v3.8 的 direction/dose/reconfiguration 干预一致性损失（full 变体，
  robust 协议）+ 去塌缩的中心化运输几何。与 v3.8 robust/full 的唯一区别是 slot
  编码：删除会塌缩的 shared-prototype 池化，改用 learned slot query + 跨 slot 中心化。
  因此 v3.8 vs v3.8.3 是一个干净的单变量对照（唯一变量=运输几何是否退化）。

data:
  study: blca
  data_root_dir: /data/CPathPatchFeature
  data_path: survot_rank/research/legacy/slotspe_runtime/dataset_csv
  wsi_encoder: uni2-h
  rna_format: Pathways
  label_col: survival_months_dss
  signature: combine
  n_classes: 4
  num_patches: 2048
  encoding_dim: 1536

split:
  k_start: 0
  k_end: 1

train:
  survot_method: dct_v383_intervention_consistency_centered
  specific_simple: dct_v3.8.3_intervention_consistency_centered_blca
  results_dir: results/dct_v3.8.3_intervention_consistency_centered/blca
  max_epochs: 50
  batch_size: 8
  grad_accum_steps: 1
  warmup_epochs: 5
  grad_clip_norm: 1.0
  seed: 3
  lr: 0.0005
  opt: adamW
  reg: 0.0005
  scheduler: cosine
  gpu: 0
  num_workers: 4
  bag_loss: nll_surv
  alpha_surv: 0.15
  # robust 协议：训练折内分箱、事件分层批、跨 batch 排序记忆。
  fit_bins_on_train: true
  event_stratified_batches: true
  min_free_space_gb: 2.0

slot:
  slot_num_wsi: 8
  slot_num_omics: 8
  slot_iters: 3
  temperature: 0.01
  topk_ratio: 0.25
  top_k_method: parallel_topk_st

model:
  otehv2_eps: 0.05
  otehv2_iter: 50
  otehv2_heads: 4
  otehv2_layers: 2
  otehv2_dropout: 0.15
  dct_num_stages: 4
  # v3.3 主线目标（继承）
  dct_lambda_ipcw_rank: 0.10
  dct_ipcw_rank_margin: 0.02
  dct_ipcw_rank_temperature: 0.50
  dct_ipcw_max_weight: 10.0
  dct_ipcw_rank_memory_size: 64
  dct_lambda_etar: 0.0
  dct_anchor_momentum: 0.90
  dct_evidence_mass_floor: 0.05
  dct_evidence_marginal_strength: 1.0
  dct_coupling_projection_iters: 1000
  dct_coupling_projection_tol: 0.0001
  dct_mix_ratio: 1.0
  fet_lambda_sparse: 0.0
  fet_lambda_faith: 0.0
  spt_prog_cost: 0.20
  rg_eps_start: 0.10
  rg_eps_anneal: 12
  # v3.8 干预一致性损失（full 变体，robust warmup/ramp，全部继承）
  dct_v38_lambda_direction: 0.05
  dct_v38_lambda_dose: 0.03
  dct_v38_lambda_reconfiguration: 0.02
  dct_v38_direction_margin: 0.02
  dct_v38_dose_margin: 0.005
  dct_v38_reconfiguration_margin: 0.02
  dct_v38_temperature: 0.05
  dct_v38_alpha_mid: 0.50
  dct_v38_alpha_full: 1.00
  dct_v38_warmup_epochs: 5
  dct_v38_ramp_epochs: 10
  dct_v38_dose_every: 2
  # v3.8.3 唯一新增：去塌缩的中心化运输几何。
  dct_v383_center_slots: true
